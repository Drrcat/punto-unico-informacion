  /* =====================================================================
     Tokens. El color principal y el de destino se pueden cambiar desde
     CONFIG (más abajo, en el script) sin tocar este bloque.
     Toda la interfaz está en rem: 1rem = 1/29 del ancho del tótem.
     ===================================================================== */
  :root{
    --ink:#0C2B36;          /* color principal: encabezado y controles activos */
    --dest:#D9430E;         /* destino: lo que el visitante busca */
    --dest-soft:#FFE1D2;
    --dest-dark:#7A2205;
    --paper:#F3F6F7;
    --line:#D9E1E5;
    --text:#0C2B36;
    --muted:#5C7380;
    --chip:#E3EBEE;
    --map:#EAF0F2;
    --fuente:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#071A21;font-family:var(--fuente);font-weight:500;color:var(--text)}
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  :focus-visible{outline:.18rem solid #7FD0E0;outline-offset:.12rem}

  /* ===== Marco del tótem ===== */
  .totem-wrap{width:100%;height:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .totem-frame{
    position:relative;aspect-ratio:53/93;height:min(96vh, 96vw * 93 / 53);max-width:96vw;
    background:var(--paper);border-radius:26px;border:10px solid #15161a;
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 2px #000 inset;overflow:hidden;
  }
  /* ?marco=0 quita el marco para incrustar el mapa en otra aplicación */
  .sin-marco .totem-wrap{padding:0}
  .sin-marco .totem-frame{aspect-ratio:auto;height:100vh;max-width:100vw;width:100vw;border:none;border-radius:0;box-shadow:none}
  .app{display:flex;flex-direction:column;height:100%;width:100%}

  /* ===== Encabezado ===== */
  header{background:var(--ink);color:#fff;flex-shrink:0;padding:.85rem 1rem .9rem}
  .marca{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem}
  .logo{width:2.5rem;height:2.5rem;border-radius:.7rem;background:var(--dest);color:#fff;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
  .logo svg{width:1.45rem;height:1.45rem}
  .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .marca-txt h1{margin:0;font-size:1.15rem;line-height:1.1;font-weight:700}
  .marca-txt p{margin:.18rem 0 0;font-size:.8rem;color:#9FB6BF}
  .reloj{margin-left:auto;text-align:right;line-height:1.1}
  .reloj b{display:block;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
  .reloj span{font-size:.74rem;color:#9FB6BF}

  .buscar{display:flex;align-items:center;gap:.6rem;background:#fff;border-radius:.9rem;padding:0 .4rem 0 .95rem;height:3.2rem;color:var(--muted);cursor:text}
  .buscar:focus-within{box-shadow:0 0 0 .2rem #7FD0E0}
  .buscar > svg{width:1.3rem;height:1.3rem;flex-shrink:0}
  .buscar input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:1.08rem;color:var(--text)}
  .buscar input::placeholder{color:#7F96A1}
  .borrar{width:2.5rem;height:2.5rem;border:0;border-radius:50%;background:var(--chip);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
  .borrar svg{width:1.1rem;height:1.1rem}
  .borrar[hidden]{display:none}

  .rapidos{display:flex;gap:.45rem;margin-top:.7rem}
  .rapidos button{
    flex:1 1 0;min-width:0;height:2.6rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
    border-radius:999px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);
    font-size:.84rem;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap
  }
  .rapidos button:active{background:rgba(255,255,255,.22)}
  .rapidos svg{width:1.1rem;height:1.1rem;flex-shrink:0}

  /* ===== Destino ===== */
  .destino{
    margin:.75rem .75rem 0;background:#fff;border:1px solid var(--line);border-radius:1rem;
    min-height:4.3rem;display:flex;align-items:center;gap:.7rem;padding:.55rem .65rem;flex-shrink:0
  }
  .d-icono{width:2.8rem;height:2.8rem;border-radius:.8rem;background:var(--dest);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .d-icono svg{width:1.5rem;height:1.5rem}
  .d-texto{flex:1;min-width:0}
  .d-texto strong{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:1.2rem;line-height:1.12;font-weight:700
  }
  .d-texto span{display:block;margin-top:.2rem;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dato{width:3.1rem;height:3.1rem;border-radius:.75rem;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
  .dato b{font-size:1.45rem;font-weight:700}
  .dato span{margin-top:.2rem;font-size:.64rem;color:#B5CAD2}
  .d-nav{display:flex;align-items:center;flex-shrink:0}
  .d-nav button{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .d-nav button:active{background:var(--chip)}
  .d-nav svg{width:1.15rem;height:1.15rem}
  .d-nav small{min-width:2.4rem;text-align:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .destino.vacio .d-icono{background:var(--chip);color:var(--ink)}
  .destino.vacio .d-texto strong{font-size:1.02rem;font-weight:500;line-height:1.25;color:var(--muted)}
  .destino.sin-resultado .d-icono{background:var(--dest-soft);color:var(--dest-dark)}
  .destino.sin-resultado .d-texto strong{font-size:1.02rem;font-weight:700;color:var(--text)}

  /* ===== Vista por torre ===== */
  .vista{margin:.7rem .75rem .55rem;display:flex;gap:.15rem;padding:.2rem;background:var(--chip);border-radius:.9rem;flex-shrink:0}
  .vista button{flex:1;height:2.45rem;border:0;border-radius:.7rem;background:transparent;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer}
  .vista button.on{background:var(--ink);color:#fff}

  /* ===== Mapa ===== */
  .map-section{
    flex:1 1 auto;min-height:0;margin:0 .75rem;position:relative;overflow:hidden;background:var(--map);
    border:1px solid var(--line);border-radius:1.1rem;touch-action:none;user-select:none;-webkit-user-select:none
  }
  #plano{position:absolute;inset:0;width:100%;height:100%;display:block;fill:none;cursor:grab}
  #plano.arrastrando{cursor:grabbing}

  .niveles{
    position:absolute;left:.6rem;bottom:.6rem;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.4rem;
    padding:.5rem .4rem .4rem;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:1.6rem;
    box-shadow:0 2px 8px rgba(12,43,54,.14)
  }
  .niveles small{font-size:.7rem;font-weight:700;color:var(--muted)}
  .niveles button{position:relative;width:2.8rem;height:2.8rem;border:0;border-radius:50%;background:var(--chip);color:var(--ink);font-size:1.3rem;font-weight:700;cursor:pointer}
  .niveles button.on{background:var(--ink);color:#fff}
  .niveles .n{
    position:absolute;top:-.3rem;right:-.3rem;min-width:1.15rem;height:1.15rem;padding:0 .25rem;border-radius:.6rem;
    background:var(--dest);color:#fff;border:.1rem solid #fff;font-size:.66rem;line-height:.95rem;text-align:center;display:none
  }
  .niveles .n.ver{display:block}

  .zoom{
    position:absolute;right:.6rem;bottom:.6rem;z-index:5;display:flex;flex-direction:column;overflow:hidden;
    background:#fff;border:1px solid var(--line);border-radius:.9rem;box-shadow:0 2px 8px rgba(12,43,54,.14)
  }
  .zoom button{width:2.9rem;height:2.9rem;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .zoom button + button{border-top:1px solid var(--line)}
  .zoom button:active{background:var(--chip)}
  .zoom svg{width:1.3rem;height:1.3rem}

  /* Etiquetas de torre: aparecen con la vista completa y llevan a cada torre */
  .torre-tags{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s ease}
  .torre-tags.ver{opacity:1}
  .torre-tags.ver .torre-tag{pointer-events:auto}
  .torre-tag{
    position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:.2rem;height:2.6rem;padding:0 .65rem 0 1rem;
    border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-size:.95rem;font-weight:700;
    white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(12,43,54,.14)
  }
  .torre-tag svg{width:1.1rem;height:1.1rem}
  .torre-tag:active{background:var(--chip)}

  /* ===== Capas del plano ===== */
  .piso{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease, visibility 0s linear .25s}
  .piso.activo{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease}
  .circulacion{fill:#FAFBFC}
  .borde, .borde *{opacity:.45;vector-effect:non-scaling-stroke}
  .vidrio{fill:#6DBAD0;stroke:#6DBAD0;stroke-width:1px;vector-effect:non-scaling-stroke;opacity:.7}
  .deco{fill:#9AA9B3;opacity:.6}

  .zona{cursor:pointer}
  .zona *{vector-effect:non-scaling-stroke}
  .zona.sala .base{fill:#D6E1E7;stroke:#667F8D;stroke-width:1px}
  .zona.bano .base{fill:#CDE9E0;stroke:#2F8F78;stroke-width:1px}
  .zona.escalera *, .zona.ascensor *{fill:none;stroke:#5E67A8;stroke-width:.6px}
  .zona.escalera .base, .zona.ascensor .base{fill:#E3E6F4;stroke-width:1px}
  .zona .rel{stroke:none}
  .zona.ascensor .rel{fill:#5E67A8}
  .zona.terraza *{fill:none;stroke:none}
  .zona.terraza line{stroke:#B98A3C;stroke-width:.6px;opacity:.45}
  .zona.terraza .rel{fill:#B98A3C;opacity:.45}
  .zona.terraza .base{fill:#F4E9D6;stroke:#B98A3C;stroke-width:1px}

  .zona.match .base{fill:var(--dest-soft) !important;stroke:var(--dest) !important}
  .zona.sel .base{fill:var(--dest) !important;stroke:var(--dest-dark) !important;stroke-width:2.2px !important}
  .zona.sel{animation:pulso 1.6s ease-in-out infinite}
  @keyframes pulso{0%,100%{filter:drop-shadow(0 0 0 rgba(217,67,14,0))}50%{filter:drop-shadow(0 0 8px rgba(217,67,14,.85))}}

  .etq{font-family:var(--fuente);font-weight:700;font-size:9.5px;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .etq.sel{fill:#fff}
  #plano.lejos .etq:not(.vis){visibility:hidden}

  /* ===== Leyenda ===== */
  .leyenda{display:flex;flex-wrap:wrap;gap:.3rem .9rem;padding:.6rem 1rem 0;font-size:.74rem;color:var(--muted);flex-shrink:0}
  .leyenda span{display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
  .leyenda i{width:.75rem;height:.75rem;border-radius:.22rem;border:.1rem solid;display:inline-block}

  /* ===== Avisos ===== */
  .avisos{
    margin:.6rem .75rem .75rem;padding:.55rem .7rem;background:#fff;border:1px solid var(--line);border-radius:1rem;
    display:flex;align-items:center;gap:.7rem;flex-shrink:0
  }
  .aviso-icono{width:2.5rem;height:2.5rem;border-radius:.7rem;background:var(--chip);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
  .aviso-icono svg{width:1.3rem;height:1.3rem}
  .avisos-pista{position:relative;flex:1;height:2.75rem}
  .aviso-item{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .5s ease}
  .aviso-item.on{opacity:1}
  .aviso-item b{font-size:.82rem;line-height:1.2}
  .aviso-item span{font-size:.76rem;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .avisos-puntos{display:flex;flex-direction:column;gap:.28rem}
  .avisos-puntos i{width:.34rem;height:.34rem;border-radius:50%;background:#C5D1D7}
  .avisos-puntos i.on{background:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    .zona.sel{animation:none}
    .piso, .piso.activo, .aviso-item{transition:none}
  }
</style>

  function caja(g){

  function insignias(){
    PISOS.forEach(p => {
      const c = resultados.filter(g => g.piso === p).length;
      const s = botonesPiso[p].querySelector('.n');
      s.textContent = c; s.classList.toggle('ver', resultados.length > 1 && c > 0);
    });
  }

  // ---------------------------------------------------------------- vista: zoom y desplazamiento
  const view = { k: 1, tx: 0, ty: 0 };
  let kMin = 0.2, kMax = 8, anim = 0;

  function tam(){ return { W: sec.clientWidth, H: sec.clientHeight }; }
  function vistaCaja(c, factor, tope){
    const { W, H } = tam();
    let k = Math.min(W / (c.w * factor), H / (c.h * factor));
    k = Math.max(kMin, Math.min(tope || kMax, k));
    return { k, tx: W / 2 - (c.x + c.w / 2) * k, ty: H / 2 - (c.y + c.h / 2) * k };
  }
  function vistaTodo(){ return vistaCaja({ x: 0, y: 0, w: VW, h: VH }, 1 / 0.96); }
  function limitar(v){
    const { W, H } = tam();
    const mx = 70;
    v.tx = Math.min(W - mx, Math.max(mx - VW * v.k, v.tx));
    v.ty = Math.min(H - mx, Math.max(mx - VH * v.k, v.ty));
    return v;
  }
  function aplicar(){
    vp.setAttribute('transform', 'translate(' + view.tx + ' ' + view.ty + ') scale(' + view.k + ')');
    const cerca = view.k >= 0.62;
    svg.classList.toggle('lejos', !cerca);
    tagsCont.classList.toggle('ver', !cerca);
    posTags();
  }
  function irA(t, ms){
    cancelAnimationFrame(anim);
    t = limitar({ k: t.k, tx: t.tx, ty: t.ty });
    if (!ms){ Object.assign(view, t); aplicar(); return; }
    const s = { k: view.k, tx: view.tx, ty: view.ty }, t0 = performance.now();
    (function paso(ahora){
      const u = Math.min(1, (ahora - t0) / ms), e = 1 - Math.pow(1 - u, 3);
      view.k = s.k + (t.k - s.k) * e; view.tx = s.tx + (t.tx - s.tx) * e; view.ty = s.ty + (t.ty - s.ty) * e;
      aplicar();
      if (u < 1) anim = requestAnimationFrame(paso);
    })(t0);
  }
  // Etiquetas de torre sobre la vista completa (posición en el plano, tamaño fijo en pantalla)
  const ANCLA_TORRE = { 1: { x: 470, y: -8 }, 2: { x: 922, y: -8 }, 3: { x: 1355, y: -8 } };
  const tagTorre = {};
  [1, 2, 3].forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'torre-tag';
    b.innerHTML = 'Torre ' + n + ICONO.adelante;
    b.addEventListener('click', () => { actividad(); irA(vistaCaja(TORRES[n], 1.04), 380); marcarTorre(n); });
    tagsCont.appendChild(b); tagTorre[n] = b;
  });
  function posTags(){
    [1, 2, 3].forEach(n => {
      const a = ANCLA_TORRE[n];
      tagTorre[n].style.transform = 'translate(' + (view.tx + a.x * view.k) + 'px,' + (view.ty + a.y * view.k) + 'px) translate(-50%,-100%)';
    });
  }
  function marcarTorre(n){ botonesTorre.forEach(b => b.classList.toggle('on', Number(b.dataset.torre) === n)); }
  function zoomEn(px, py, factor){
    cancelAnimationFrame(anim);
    const k2 = Math.max(kMin, Math.min(kMax, view.k * factor));
    const f = k2 / view.k;
    view.tx = px - (px - view.tx) * f; view.ty = py - (py - view.ty) * f; view.k = k2;
    limitar(view); aplicar(); marcarTorre(-1);
  }
  function resize(){
    escalaUI();
    const { W, H } = tam(); if (!W || !H) return;
    const base = vistaTodo();
    kMin = base.k * 0.95; kMax = base.k * 16;
    if (!view.listo){ view.listo = true; irA(base, 0); }
    else { limitar(view); aplicar(); }
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(sec);

  // ---------------------------------------------------------------- gestos
  const punteros = new Map();
  let arrastre = null, pinza = null, movido = false;
  function rel(e){ const r = sec.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  svg.addEventListener('pointerdown', e => {
    actividad();
    svg.setPointerCapture(e.pointerId);
    punteros.set(e.pointerId, rel(e));
    movido = false;
    if (punteros.size === 1){ arrastre = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty }; }
    else if (punteros.size === 2){
      const [a, b] = Array.from(punteros.values());
      pinza = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k, tx: view.tx, ty: view.ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      arrastre = null; movido = true;
    }
  });
  svg.addEventListener('pointermove', e => {
    if (!punteros.has(e.pointerId)) return;
    punteros.set(e.pointerId, rel(e));
    if (pinza && punteros.size >= 2){
      const [a, b] = Array.from(punteros.values());
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const k2 = Math.max(kMin, Math.min(kMax, pinza.k * d / pinza.d)), f = k2 / pinza.k;
      view.k = k2;
      view.tx = pinza.mx - (pinza.mx - pinza.tx) * f + ((a.x + b.x) / 2 - pinza.mx);
      view.ty = pinza.my - (pinza.my - pinza.ty) * f + ((a.y + b.y) / 2 - pinza.my);
      limitar(view); aplicar(); marcarTorre(-1);
    } else if (arrastre){
      const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
      if (Math.hypot(dx, dy) > 6){ movido = true; svg.classList.add('arrastrando'); }
      if (movido){ cancelAnimationFrame(anim); view.tx = arrastre.tx + dx; view.ty = arrastre.ty + dy; limitar(view); aplicar(); marcarTorre(-1); }
    }
  });
  function soltar(e){
    const era1 = punteros.size === 1;
    punteros.delete(e.pointerId);
    if (punteros.size < 2) pinza = null;
    svg.classList.remove('arrastrando');
    if (era1 && !movido){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('.zona') : null;
      if (g){ const z = porId.get(g.dataset.id); input.value = nombreDe(z); seleccionar([z.grupo], 0, true); }
    }
    if (punteros.size === 1){
      const [p] = Array.from(punteros.values());
      arrastre = { x: p.x + sec.getBoundingClientRect().left, y: p.y + sec.getBoundingClientRect().top, tx: view.tx, ty: view.ty };
    } else if (!punteros.size) arrastre = null;
  }
  svg.addEventListener('pointerup', soltar);
  svg.addEventListener('pointercancel', soltar);
  svg.addEventListener('wheel', e => {
    e.preventDefault(); actividad();
    const p = rel(e); zoomEn(p.x, p.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  document.getElementById('zoomIn').addEventListener('click', () => { actividad(); const { W, H } = tam(); zoomEn(W / 2, H / 2, 1.4); });
  document.getElementById('zoomOut').addEventListener('click', () => { actividad(); const { W, H } = tam(); zoomEn(W / 2, H / 2, 1 / 1.4); });
  document.getElementById('reset').addEventListener('click', () => { actividad(); limpiar(); irA(vistaTodo(), 300); marcarTorre(0); });
  botonesTorre.forEach(b => b.addEventListener('click', () => {
    actividad();
    const n = Number(b.dataset.torre);
    irA(n ? vistaCaja(TORRES[n], 1.04) : vistaTodo(), 380); marcarTorre(n);
  }));

  // ---------------------------------------------------------------- tarjeta de destino
  let resultados = [], actual = 0;

  function pintarDestino(modo){
    if (modo === 'vacio'){
      destino.className = 'destino vacio';
      destino.innerHTML = '<div class="d-icono">' + ICONO.pin + '</div><div class="d-texto"><strong>Busca un lugar o toca una sala en el mapa.</strong></div>';
      return;
    }
    if (modo === 'nada'){
      destino.className = 'destino sin-resultado';
      destino.innerHTML = '<div class="d-icono">' + ICONO.alerta + '</div><div class="d-texto"><strong>No encontramos ese lugar</strong><span>Revisa el nombre o prueba con un acceso rápido.</span></div>';
      return;
    }
    const g = resultados[actual], z = g.zonas[0];
    const tipoTxt = NOMBRE_TIPO[z.tipo] || '';
    const sub = z.detalle || (normalizar(nombreDe(z)).includes(normalizar(tipoTxt)) ? '' : tipoTxt);
    destino.className = 'destino';
    destino.innerHTML =
      '<div class="d-icono">' + (ICONO[z.tipo] || ICONO.pin) + '</div>' +
      '<div class="d-texto"><strong>' + esc(nombreDe(z)) + '</strong>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="dato"><b>' + z.piso + '</b><span>piso</span></div>' +
      '<div class="dato"><b>' + z.torre + '</b><span>torre</span></div>' +
      (resultados.length > 1
        ? '<div class="d-nav"><button type="button" data-d="-1" aria-label="Resultado anterior">' + ICONO.atras + '</button>' +
          '<small>' + (actual + 1) + ' de ' + resultados.length + '</small>' +
          '<button type="button" data-d="1" aria-label="Resultado siguiente">' + ICONO.adelante + '</button></div>'
        : '');
    destino.querySelectorAll('.d-nav button').forEach(b => b.addEventListener('click', () => {
      actividad();
      const n = resultados.length;
      seleccionar(resultados, (actual + Number(b.dataset.d) + n) % n, true);
    }));
  }

  // ---------------------------------------------------------------- selección y búsqueda en todos los pisos
  function sincronizarBorrar(){ borrar.hidden = !input.value; }
  function limpiarMarcas(){
    ZONAS.forEach(z => {
      if (z.el) z.el.classList.remove('sel', 'match');
      if (z.etq) z.etq.classList.remove('vis', 'sel');
    });
  }
  function limpiar(){
    limpiarMarcas(); resultados = []; actual = 0; input.value = '';
    sincronizarBorrar(); pintarDestino('vacio'); insignias();
  }
  function seleccionar(lista, idx, mantenerTexto){
    limpiarMarcas();
    resultados = lista; actual = idx;
    lista.forEach(g => g.zonas.forEach(z => { if (z.el) z.el.classList.add('match'); }));
    const g = lista[idx], z = g.zonas[0];
    g.zonas.forEach(zz => {
      if (zz.el){ zz.el.classList.remove('match'); zz.el.classList.add('sel'); }
      if (zz.etq) zz.etq.classList.add('sel');
    });
    lista.forEach(l => l.zonas.forEach(zz => { if (zz.etq) zz.etq.classList.add('vis'); }));
    if (!mantenerTexto && lista.length === 1) input.value = nombreDe(z);
    sincronizarBorrar();
    mostrarPiso(g.piso);
    pintarDestino('resultado'); insignias();
    marcarTorre(-1);
    const c = caja(g);
    const factor = Math.max(1.4, Math.min(6, 330 / Math.max(c.w, c.h)));
    irA(vistaCaja(c, factor, kMax * 0.55), 420);
    document.dispatchEvent(new CustomEvent('orientasede:seleccion', {
      detail: { piso: z.piso, id: z.id, ids: g.zonas.map(q => q.id), nombre: nombreDe(z), tipo: z.tipo, torre: z.torre }
    }));
  }
  function puntaje(g, n){
    const z = g.zonas[0], nom = normalizar(nombreDe(z));
    if (nom === n) return 0;
    if (nom.startsWith(n)) return 1;
    if (nom.includes(n)) return 2;
    if (z.detalle && normalizar(z.detalle).includes(n)) return 3;
    if (g.zonas.some(q => normalizar(q.id).includes(n))) return 3;
    const tipos = [NOMBRE_TIPO[z.tipo] || ''].concat(SINONIMOS[z.tipo] || []);
    if (tipos.some(t => normalizar(t).startsWith(n))) return 4;
    return 9;
  }
  function buscar(q){
    const n = normalizar(q);
    if (!n){ limpiar(); return; }
    const hit = GRUPOS.map(g => ({ g, s: puntaje(g, n) })).filter(h => h.s < 9);
    const prioridad = g => g.piso === pisoActual ? 0 : g.piso;
    hit.sort((a, b) => (prioridad(a.g) - prioridad(b.g)) || (a.s - b.s) ||
                       (a.g.zonas[0].torre - b.g.zonas[0].torre) || (a.g.zonas[0].cx - b.g.zonas[0].cx));
    if (hit.length) seleccionar(hit.map(h => h.g), 0, true);
    else { limpiarMarcas(); resultados = []; insignias(); pintarDestino('nada'); }
  }
  input.addEventListener('input', e => { actividad(); sincronizarBorrar(); buscar(e.target.value); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && resultados.length > 1) seleccionar(resultados, (actual + 1) % resultados.length, true); });
  borrar.addEventListener('click', () => { actividad(); limpiar(); input.focus(); });

  // ---------------------------------------------------------------- inactividad
  let reloj = 0;
  function actividad(){
    clearTimeout(reloj);
    reloj = setTimeout(() => { limpiar(); mostrarPiso(PISO_INICIAL); irA(vistaTodo(), 400); marcarTorre(0); }, CONFIG.inactividadS * 1000);
  }
  ['keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, actividad, { passive: true }));

  // ---------------------------------------------------------------- API para integrar con la aplicación del tótem
  function resolver(id){
    const z = porId.get(id);
    if (z) return z.grupo;
    const n = normalizar(id);
    const cand = GRUPOS.filter(g => normalizar(nombreDe(g.zonas[0])) === n);
    return cand.find(g => g.piso === pisoActual) || cand[0] || null;
  }
  window.OrientaMapa = {
    pisos: PISOS,
    get piso(){ return pisoActual; },
    zonas: ZONAS.map(z => ({ id: z.id, piso: z.piso, nombre: nombreDe(z), tipo: z.tipo, torre: z.torre })),
    setPiso: n => mostrarPiso(Number(n)),
    buscar: q => { input.value = q; sincronizarBorrar(); buscar(q); },
    seleccionar: id => { const g = resolver(id); if (g) seleccionar([g], 0); return !!g; },
    limpiar,
    setNombres: obj => { Object.assign(NOMBRES, obj); ajustarTodas(); }
  };

  // ---------------------------------------------------------------- avisos
  (function avisos(){
    const AV = CONFIG.avisos || [];
    const pistaAv = document.getElementById('avisos-pista'), puntos = document.getElementById('avisos-puntos');
    const icono = document.getElementById('aviso-icono');
    if (!AV.length){ document.querySelector('.avisos').style.display = 'none'; return; }
    AV.forEach((a, i) => {
      const it = document.createElement('div');
      it.className = 'aviso-item' + (i === 0 ? ' on' : '');
      it.innerHTML = '<b>' + esc(a.titulo) + '</b><span>' + esc(a.texto) + '</span>';
      pistaAv.appendChild(it);
      const p = document.createElement('i'); if (i === 0) p.className = 'on'; puntos.appendChild(p);
    });
    let k = 0;
    const pintaIcono = () => { icono.innerHTML = ICONO[AV[k].icono] || ICONO.info; };
    pintaIcono();
    if (AV.length > 1) setInterval(() => {
      const items = pistaAv.children, ps = puntos.children;
      items[k].classList.remove('on'); ps[k].classList.remove('on');
      k = (k + 1) % AV.length;
      items[k].classList.add('on'); ps[k].classList.add('on');
      pintaIcono();
    }, 6000);
  })();

  // ---------------------------------------------------------------- arranque
  mostrarPiso(PISO_INICIAL);
  pintarDestino('vacio');
  resize();
  ajustarTodas();
  actividad();
  const pre = params.get('sala');
  if (pre) window.OrientaMapa.seleccionar(pre);
})();
</script>
