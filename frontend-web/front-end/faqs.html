<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preguntas Frecuentes · Punto Único</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="barra-superior">
    <div class="marca">
      <span class="logo">PU</span>
      <div>
        <strong>Punto Único de Información</strong>
        <small>Tótem de orientación estudiantil</small>
      </div>
    </div>
    <a class="boton-volver" href="index.html">‹ Inicio</a>
  </header>

  <section class="titulo">
    <h1>Preguntas Frecuentes</h1>
    <p>Toca una pregunta para ver la respuesta</p>
  </section>

  <main class="contenedor">
    <input type="search" id="buscador" class="buscador" placeholder="🔍  Busca tu pregunta (ej: certificado, arancel...)" autocomplete="off">
    <p id="contador" class="contador" aria-live="polite"></p>

    <div id="lista-faqs">
      <!-- Aquí aparecerán las preguntas automáticamente -->
    </div>
  </main>

  <footer class="pie">
    <p>Punto Único de Información · Tótem de orientación estudiantil</p>
  </footer>

  <script src="comun.js"></script>
  <script src="faqs.js"></script>

</body>
</html>
